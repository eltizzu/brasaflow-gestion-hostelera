<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ecosistema Brasa — Suite operativa para hostelería</title>
  <meta name="description" content="BrasaFlow, BrasaConnect, BrasaReservas y BrasaComandas: cuatro herramientas conectadas para ordenar la operativa completa de tu negocio hostelero." />
  <link rel="icon" type="image/svg+xml" href="assets/logo-brasaflow.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5efe4;
      --bg-alt: #efe5d4;
      --surface: #fffaf2;
      --border: rgba(85,58,33,0.13);
      --text: #2f2419;
      --muted: #6f6254;
      --accent: #c86f31;
      --accent-dark: #8f3f17;
      --accent-soft: #f8dcc4;
      --green: #2b7f63;
      --radius: 18px;
      --shadow: 0 12px 32px rgba(74,46,23,0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Outfit", sans-serif; color: var(--text); background: linear-gradient(135deg, var(--bg) 0%, var(--bg-alt) 100%); min-height: 100vh; }

    nav { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; height: 64px; background: rgba(255,250,242,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
    .nav-brand { font-family: "Sora", sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--accent-dark); text-decoration: none; }
    .nav-brand span { color: var(--accent); }
    .nav-links { display: flex; align-items: center; gap: 28px; }
    .nav-links a { color: var(--muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color .2s; }
    .nav-links a:hover { color: var(--text); }
    .nav-cta { background: var(--accent) !important; color: #fff !important; padding: 8px 20px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; text-decoration: none; transition: background .2s; }
    .nav-cta:hover { background: var(--accent-dark) !important; }

    .hero { max-width: 900px; margin: 0 auto; padding: 80px 24px 64px; text-align: center; }
    .eyebrow { display: inline-block; background: var(--accent-soft); color: var(--accent-dark); font-size: 0.8rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 5px 14px; border-radius: 20px; margin-bottom: 20px; }
    h1 { font-family: "Sora", sans-serif; font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 700; line-height: 1.15; letter-spacing: -0.03em; color: var(--text); margin-bottom: 20px; }
    h1 em { color: var(--accent); font-style: normal; }
    .hero-sub { font-size: 1.1rem; color: var(--muted); line-height: 1.7; max-width: 640px; margin: 0 auto 36px; }
    .hero-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .btn-primary { background: var(--accent); color: #fff; padding: 13px 28px; border-radius: 12px; font-weight: 600; text-decoration: none; transition: background .2s; font-size: 0.95rem; }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-ghost { background: transparent; color: var(--text); padding: 13px 28px; border-radius: 12px; font-weight: 600; text-decoration: none; border: 1.5px solid var(--border); transition: border-color .2s; font-size: 0.95rem; }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    .section { max-width: 960px; margin: 0 auto; padding: 64px 24px; }
    .section-label { font-size: 0.8rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
    .section-title { font-family: "Sora", sans-serif; font-size: clamp(1.5rem, 3vw, 2.2rem); font-weight: 700; letter-spacing: -0.02em; margin-bottom: 16px; }
    .section-sub { color: var(--muted); font-size: 1.05rem; line-height: 1.7; max-width: 600px; }

    .problema-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 40px; }
    .problema-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
    .problema-icon { font-size: 1.6rem; margin-bottom: 10px; }
    .problema-card h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 6px; }
    .problema-card p { font-size: 0.88rem; color: var(--muted); line-height: 1.6; }

    .modulos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 24px; margin-top: 40px; }
    .modulo-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 16px; }
    .modulo-header { display: flex; align-items: center; gap: 14px; }
    .modulo-icon { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; }
    .modulo-card h3 { font-family: "Sora", sans-serif; font-size: 1.15rem; font-weight: 700; }
    .modulo-tag { font-size: 0.75rem; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
    .modulo-card p { color: var(--muted); font-size: 0.9rem; line-height: 1.7; }
    .modulo-features { list-style: none; display: flex; flex-direction: column; gap: 6px; }
